name: Windows portable release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Prepare verified runtime
        shell: powershell
        run: ./scripts/prepare-runtime.ps1
      - name: Build portable ZIP
        shell: powershell
        run: ./scripts/build-portable.ps1
      - name: Test extracted package
        shell: powershell
        run: ./test/portable-smoke.ps1
      - name: Record archive checksum
        shell: powershell
        run: |
          $file='release/SoundMesh-Windows-x64.zip'
          $digest=(Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path $PWD 'release/SoundMesh-Windows-x64.zip.sha256'),$digest+'  SoundMesh-Windows-x64.zip'+[Environment]::NewLine)
      - uses: actions/upload-artifact@v7
        with:
          name: SoundMesh-Windows-x64
          path: |
            release/SoundMesh-Windows-x64.zip
            release/SoundMesh-Windows-x64.zip.sha256
          if-no-files-found: error
      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create $env:RELEASE_TAG 'release/SoundMesh-Windows-x64.zip' 'release/SoundMesh-Windows-x64.zip.sha256' --title "SoundMesh $env:RELEASE_TAG" --notes-file .github/RELEASE_NOTES.md --verify-tag
